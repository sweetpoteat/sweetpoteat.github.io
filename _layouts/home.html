<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | truncate: 160 }}">

  <link rel="icon" href="{{ '/assets/images/sp_logo1-removebg-preview.png' | relative_url }}" type="image/png">

  <!-- Local CSS -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <!-- Floating Mini Cart -->
  <div id="floating-cart">
    <button id="cart-toggle">
      <i class="fas fa-shopping-cart"></i>
      <span id="cart-count">0</span>
    </button>
    <div id="cart-dropdown">
      <p>Your cart is empty</p>
    </div>
  </div>

  {% include top-nav.html %}

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">
        <img src="{{ '/assets/images/sp_logo1-removebg-preview.png' | relative_url }}" alt="Sweet Poteat" class="site-footer__logo">
        <p class="site-footer__tagline">Homemade treats with love · Utah County, UT</p>
      </div>
      <nav class="site-footer__nav" aria-label="Footer navigation">
        <a href="{{ site.baseurl }}/all/">Shop</a>
        <a href="{{ site.baseurl }}/about/">About</a>
        <a href="{{ site.baseurl }}/favors/">Favors</a>
        <a href="{{ site.baseurl }}/testimonials/">Testimonials</a>
        <a href="{{ site.baseurl }}/contact/">Contact</a>
      </nav>
      <div class="site-footer__contact">
        <p>Utah County, UT</p>
      </div>
    </div>
    <p class="site-footer__copy">&copy; {{ site.time | date: "%Y" }} Sweet Poteat &middot; All rights reserved</p>
  </footer>

  <!-- Local JS -->
  <script>
  const BASEURL = "{{ site.baseurl }}";
  </script>
  <script src="{{ '/assets/js/cart.js' | relative_url }}"></script>

</body>
</html>
